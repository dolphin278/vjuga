name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install -g npm@11
      - name: Confirm npm version
        run: |
          which npm
          npm --version
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: npm publish --provenance --access public

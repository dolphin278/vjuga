name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install npm 11+ via corepack for OIDC Trusted Publishers
        run: |
          corepack enable
          COREPACK_ENABLE_STRICT=0 corepack prepare npm@latest --activate
          echo "npm version: $(npm --version)"
      - run: npm set registry https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: npm publish --provenance --access public
        env:
          NPM_CONFIG_LOGLEVEL: silly

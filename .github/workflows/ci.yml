name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun fmt --check
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:docs

  # Three independent checkers, each on the library config (tests excluded)
  # and the test config (everything under src/). One job per pair, so a red
  # check names the checker and config that disagree.
  typecheck:
    name: Typecheck (${{ matrix.checker }}, ${{ matrix.tsconfig }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checker: [tsc, tsc-rs, bun]
        tsconfig: [tsconfig.json, tsconfig.test.json]
        include:
          - checker: tsc
            command: ./node_modules/.bin/tsc --noEmit
          - checker: tsc-rs
            command: ./node_modules/.bin/tsc-rs --noEmit
          # --no-script: `bun check` runs a package.json "check" script
          # instead of type checking when one exists.
          - checker: bun
            command: bun check --no-script --no-pretty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: matrix.checker == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - if: matrix.checker == 'bun'
        run: test "$(bun --version)" = "$(cat .bun-version)"
      - run: npm ci
      - run: ${{ matrix.command }} -p ${{ matrix.tsconfig }}

  # Compiles each consumer program in scripts/scriptc-smoke with scriptc, runs
  # the native binary and diffs its output against Bun (the oracle).
  scriptc-smoke:
    name: scriptc smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # scriptc resolves @types/node from node_modules; without it the build
      # reports spurious SC0001 type errors.
      - run: npm ci
      - run: npm install --no-save scriptc@0.4.4
      - run: SCRIPTC="$PWD/node_modules/.bin/scriptc" scripts/scriptc-smoke/run.sh

  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: node-22
            node-version: "22"
          - runtime: node-25
            node-version: "25"
          - runtime: bun
    steps:
      - uses: actions/checkout@v4
      - if: matrix.runtime != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - if: matrix.runtime == 'bun'
        run: test "$(bun --version)" = "$(cat .bun-version)"
      - if: matrix.runtime != 'bun'
        run: npm ci
      - if: matrix.runtime != 'bun'
        run: npm run build
      - if: matrix.runtime != 'bun'
        run: npm run coverage
      - if: matrix.runtime == 'bun'
        run: bun install
      - if: matrix.runtime == 'bun'
        run: bun run coverage:bun
